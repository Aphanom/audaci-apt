name: Cross-Platform Build

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  VOSK_MODEL_URL: "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip"
  VOSK_MODEL_DIR: "vosk-model-small-ru-0.22"

jobs:
  # ──────────────────────────────────────────────
  #  Windows
  # ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Модель Vosk
        id: vosk-cache
        uses: actions/cache@v4
        with:
          path: model
          key: vosk-model-small-ru-0.22

      - name: Скачивание модели
        if: steps.vosk-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o model.zip "${{ env.VOSK_MODEL_URL }}"
          unzip -q model.zip
          mv "${{ env.VOSK_MODEL_DIR }}" model
          rm model.zip

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Сборка EXE
        run: flet build windows --product "Audaci" --no-rich-output

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Audaci-Windows
          path: build/windows/
          retention-days: 14

  # ──────────────────────────────────────────────
  #  macOS
  # ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install delocate  # Инструмент для фикса путей dylib

      - name: Модель Vosk
        id: vosk-cache
        uses: actions/cache@v4
        with:
          path: model
          key: vosk-model-small-ru-0.22

      - name: Скачивание модели
        if: steps.vosk-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o model.zip "${{ env.VOSK_MODEL_URL }}"
          unzip -q model.zip
          mv "${{ env.VOSK_MODEL_DIR }}" model
          rm model.zip

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Сборка macOS APP
        run: |
          # ФИКС PILLOW: delocate вшивает зависимости внутрь .so файлов,
          # избавляя от проблемы с отсутствующей скрытой папкой .dylibs
          PIL_PATH=$(python -c 'import PIL; print(PIL.__path__[0])')
          echo "Fixing Pillow at $PIL_PATH"
          delocate-path -v "$PIL_PATH"
          
          flet build macos --product "Audaci" --no-rich-output

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Audaci-macOS
          path: build/macos/
          retention-days: 14

  # ──────────────────────────────────────────────
  #  Linux
  # ──────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Системные зависимости
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libglib2.0-dev ninja-build cmake clang \
            libvlc-dev vlc portaudio19-dev dpkg-dev fakeroot

      - name: Зависимости Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Модель Vosk
        id: vosk-cache
        uses: actions/cache@v4
        with:
          path: model
          key: vosk-model-small-ru-0.22

      - name: Скачивание модели
        if: steps.vosk-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o model.zip "${{ env.VOSK_MODEL_URL }}"
          unzip -q model.zip
          mv "${{ env.VOSK_MODEL_DIR }}" model
          rm model.zip

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Сборка Linux
        run: flet build linux --product "Audaci" --no-rich-output

      - name: Упаковка в .deb
        run: |
          APP_VERSION="1.0.0"
          ARCH="amd64"
          PKG_NAME="audaci_${APP_VERSION}_${ARCH}"
          mkdir -p "${PKG_NAME}/usr/local/lib/audaci" "${PKG_NAME}/usr/local/bin" "${PKG_NAME}/usr/share/applications" "${PKG_NAME}/DEBIAN"
          cp -r build/linux/. "${PKG_NAME}/usr/local/lib/audaci/"
          ln -sf "/usr/local/lib/audaci/audaci" "${PKG_NAME}/usr/local/bin/audaci"
          cat > "${PKG_NAME}/usr/share/applications/audaci.desktop" <<EOF
          [Desktop Entry]
          Name=Audaci
          Exec=/usr/local/bin/audaci
          Icon=/usr/local/lib/audaci/data/flutter_assets/assets/icon.png
          Type=Application
          Categories=Audio;Player;
          EOF
          cat > "${PKG_NAME}/DEBIAN/control" <<EOF
          Package: audaci
          Version: ${APP_VERSION}
          Architecture: ${ARCH}
          Depends: libgtk-3-0, libvlc5, vlc, portaudio19
          Maintainer: Audaci Team
          Description: Audaci Music Player
          EOF
          fakeroot dpkg-deb --build "$PKG_NAME"

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Audaci-Linux-deb
          path: "*.deb"
          retention-days: 14
