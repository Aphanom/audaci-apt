name: Cross-Platform Build

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  VOSK_MODEL_URL: "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip"
  VOSK_MODEL_DIR: "vosk-model-small-ru-0.22"

jobs:
  # ──────────────────────────────────────────────
  #  Windows
  # ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Модель Vosk
        id: vosk-cache
        uses: actions/cache@v4
        with:
          path: model
          key: vosk-model-small-ru-0.22

      - name: Скачивание модели
        if: steps.vosk-cache.outputs.cache-hit != 'true'
        run: |
          curl -L --ssl-no-revoke --retry 5 --retry-delay 5 --connect-timeout 30 -o model.zip "${{ env.VOSK_MODEL_URL }}"
          unzip -q model.zip
          mv "${{ env.VOSK_MODEL_DIR }}" model
          rm model.zip

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Сборка EXE
        env:
          PYTHONUTF8: 1
        run: flet build windows --product "Audaci" --no-rich-output

      - name: Скачивание и упаковка VLC для Windows
        run: |
          PRIMARY_URL="https://get.videolan.org/vlc/3.0.21/win64/vlc-3.0.21-win64.zip"
          BACKUP_URL="https://ftp.halifax.rwth-aachen.de/videolan/vlc/3.0.21/win64/vlc-3.0.21-win64.zip"
          echo "Downloading VLC..."
          if curl -L --ssl-no-revoke --retry 5 --retry-delay 5 --connect-timeout 30 -o vlc-win64.zip "$PRIMARY_URL"; then
            echo "Successfully downloaded VLC from primary server."
          else
            echo "Primary server failed. Trying backup mirror..."
            curl -L --ssl-no-revoke --retry 5 --retry-delay 5 --connect-timeout 30 -o vlc-win64.zip "$BACKUP_URL"
          fi
          unzip -q vlc-win64.zip
          mkdir -p build/windows/vlc
          cp vlc-3.0.21/libvlc.dll build/windows/vlc/
          cp vlc-3.0.21/libvlccore.dll build/windows/vlc/
          cp -r vlc-3.0.21/plugins build/windows/vlc/
          rm -rf vlc-3.0.21 vlc-win64.zip

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Audaci-Windows
          path: build/windows/
          retention-days: 14

  # ──────────────────────────────────────────────
  #  macOS
  # ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install delocate  # Инструмент для фикса путей dylib

      - name: Модель Vosk
        id: vosk-cache
        uses: actions/cache@v4
        with:
          path: model
          key: vosk-model-small-ru-0.22

      - name: Скачивание модели
        if: steps.vosk-cache.outputs.cache-hit != 'true'
        run: |
          curl -L --retry 5 --retry-delay 5 --connect-timeout 30 -o model.zip "${{ env.VOSK_MODEL_URL }}"
          unzip -q model.zip
          mv "${{ env.VOSK_MODEL_DIR }}" model
          rm model.zip

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Сборка macOS APP
        run: |
          # 1. Собираем приложение
          flet build macos --product "Audaci" --no-rich-output
          
          # 2. Скачивание и упаковка VLC для macOS
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            VLC_PATH="vlc/3.0.21/macosx/vlc-3.0.21-arm64.dmg"
          else
            VLC_PATH="vlc/3.0.21/macosx/vlc-3.0.21-intel64.dmg"
          fi
          PRIMARY_URL="https://get.videolan.org/$VLC_PATH"
          BACKUP_URL="https://ftp.halifax.rwth-aachen.de/videolan/$VLC_PATH"
          echo "Downloading VLC..."
          if curl -L --retry 5 --retry-delay 5 --connect-timeout 30 -o vlc-macos.dmg "$PRIMARY_URL"; then
            echo "Successfully downloaded VLC from primary server."
          else
            echo "Primary server failed. Trying backup mirror..."
            curl -L --retry 5 --retry-delay 5 --connect-timeout 30 -o vlc-macos.dmg "$BACKUP_URL"
          fi
          
          echo "Mounting VLC DMG..."
          hdiutil attach vlc-macos.dmg -mountpoint /Volumes/VLC
          
          mkdir -p build/macos/Audaci.app/Contents/MacOS/vlc
          
          echo "Copying VLC libraries and plugins..."
          cp /Volumes/VLC/VLC.app/Contents/MacOS/lib/libvlc.dylib build/macos/Audaci.app/Contents/MacOS/vlc/
          cp /Volumes/VLC/VLC.app/Contents/MacOS/lib/libvlccore.dylib build/macos/Audaci.app/Contents/MacOS/vlc/
          cp -r /Volumes/VLC/VLC.app/Contents/MacOS/plugins build/macos/Audaci.app/Contents/MacOS/vlc/
          
          echo "Detaching VLC DMG..."
          hdiutil detach /Volumes/VLC
          rm vlc-macos.dmg
          
          echo "Adding loader path to VLC libraries..."
          install_name_tool -add_rpath "@loader_path" build/macos/Audaci.app/Contents/MacOS/vlc/libvlc.dylib || true
          
          # 3. Находим все папки PIL внутри собранного бандла
          # serious_python может иметь несколько копий или специфичную структуру
          echo "Searching for PIL in the bundle..."
          BUNDLE_PIL_DIRS=$(find build/macos -name "PIL" -type d)
          
          if [ -z "$BUNDLE_PIL_DIRS" ]; then
            echo "Warning: Could not find PIL inside build/macos"
            exit 0
          fi

          # Получаем путь к PIL в системе (откуда будем брать dylibs)
          RUNNER_PIL=$(python -c 'import PIL; print(PIL.__path__[0])')
          echo "Runner PIL path: $RUNNER_PIL"

          for BUNDLE_PIL in $BUNDLE_PIL_DIRS; do
            echo "Processing bundled PIL at $BUNDLE_PIL"
            
            # Копируем .dylibs принудительно
            if [ -d "$RUNNER_PIL/.dylibs" ]; then
              echo "Ensuring .dylibs are present in $BUNDLE_PIL"
              mkdir -p "$BUNDLE_PIL/.dylibs"
              cp -af "$RUNNER_PIL/.dylibs/"* "$BUNDLE_PIL/.dylibs/"
            fi
            
            # Фиксим пути в PIL
            echo "Fixing dylib links in $BUNDLE_PIL"
            delocate-path -v "$BUNDLE_PIL" || true

            # Проверка, что libtiff на месте
            if [ -f "$BUNDLE_PIL/.dylibs/libtiff.6.dylib" ]; then
              echo "✅ libtiff.6.dylib successfully bundled in $BUNDLE_PIL"
            else
              echo "❌ Error: libtiff.6.dylib still missing in $BUNDLE_PIL!"
            fi
          done

          # 4. Упаковываем в ZIP для сохранения symlinks и hidden files (.dylibs)
          echo "Packaging Audaci.app into a ZIP archive..."
          cd build/macos
          zip -r -y Audaci-macOS.zip Audaci.app

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Audaci-macOS
          path: build/macos/Audaci-macOS.zip
          retention-days: 14

  # ──────────────────────────────────────────────
  #  Linux
  # ──────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Системные зависимости
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libglib2.0-dev ninja-build cmake clang \
            libvlc-dev vlc portaudio19-dev dpkg-dev fakeroot

      - name: Зависимости Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Модель Vosk
        id: vosk-cache
        uses: actions/cache@v4
        with:
          path: model
          key: vosk-model-small-ru-0.22

      - name: Скачивание модели
        if: steps.vosk-cache.outputs.cache-hit != 'true'
        run: |
          curl -L --retry 5 --retry-delay 5 --connect-timeout 30 -o model.zip "${{ env.VOSK_MODEL_URL }}"
          unzip -q model.zip
          mv "${{ env.VOSK_MODEL_DIR }}" model
          rm model.zip

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Сборка Linux
        run: flet build linux --product "Audaci" --no-rich-output

      - name: Упаковка в .deb
        run: |
          APP_VERSION="1.0.0"
          ARCH="amd64"
          PKG_NAME="audaci_${APP_VERSION}_${ARCH}"
          mkdir -p "${PKG_NAME}/usr/local/lib/audaci" "${PKG_NAME}/usr/local/bin" "${PKG_NAME}/usr/share/applications" "${PKG_NAME}/DEBIAN"
          cp -r build/linux/. "${PKG_NAME}/usr/local/lib/audaci/"
          ln -sf "/usr/local/lib/audaci/audaci" "${PKG_NAME}/usr/local/bin/audaci"
          cat > "${PKG_NAME}/usr/share/applications/audaci.desktop" <<EOF
          [Desktop Entry]
          Name=Audaci
          Exec=/usr/local/bin/audaci
          Icon=/usr/local/lib/audaci/data/flutter_assets/assets/icon.png
          Type=Application
          Categories=Audio;Player;
          EOF
          cat > "${PKG_NAME}/DEBIAN/control" <<EOF
          Package: audaci
          Version: ${APP_VERSION}
          Architecture: ${ARCH}
          Depends: libgtk-3-0, libvlc5, vlc, portaudio19
          Maintainer: Audaci Team
          Description: Audaci Music Player
          EOF
          fakeroot dpkg-deb --build "$PKG_NAME"

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Audaci-Linux-deb
          path: "*.deb"
          retention-days: 14
