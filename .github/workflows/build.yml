name: Cross-Platform Build

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  VOSK_MODEL_URL: "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip"
  VOSK_MODEL_DIR: "vosk-model-small-ru-0.22"

jobs:
  # ──────────────────────────────────────────────
  #  Windows
  # ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Модель Vosk
        id: vosk-cache
        uses: actions/cache@v4
        with:
          path: model
          key: vosk-model-small-ru-0.22

      - name: Скачивание модели
        if: steps.vosk-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o model.zip "${{ env.VOSK_MODEL_URL }}"
          unzip -q model.zip
          mv "${{ env.VOSK_MODEL_DIR }}" model
          rm model.zip

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Сборка EXE
        env:
          PYTHONUTF8: 1
        run: flet build windows --product "Audaci" --no-rich-output

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Audaci-Windows
          path: build/windows/
          retention-days: 14

  # ──────────────────────────────────────────────
  #  macOS
  # ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install delocate  # Инструмент для фикса путей dylib

      - name: Модель Vosk
        id: vosk-cache
        uses: actions/cache@v4
        with:
          path: model
          key: vosk-model-small-ru-0.22

      - name: Скачивание модели
        if: steps.vosk-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o model.zip "${{ env.VOSK_MODEL_URL }}"
          unzip -q model.zip
          mv "${{ env.VOSK_MODEL_DIR }}" model
          rm model.zip

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Сборка macOS APP
        run: |
          # 1. Собираем приложение
          flet build macos --product "Audaci" --no-rich-output
          
          # 2. Находим PIL внутри собранного бандла
          # Путь обычно: build/macos/Audaci.app/Contents/Frameworks/serious_python_darwin.framework/Resources/python.bundle/Contents/Resources/site-packages/PIL
          BUNDLE_PIL=$(find build/macos -name "PIL" -type d | head -n 1)
          
          if [ -n "$BUNDLE_PIL" ]; then
            echo "Found bundled PIL at $BUNDLE_PIL"
            
            # Получаем путь к PIL в системе (откуда будем брать dylibs)
            RUNNER_PIL=$(python -c 'import PIL; print(PIL.__path__[0])')
            
            # Если папка .dylibs не попала в бандл (обычно так и бывает), копируем её принудительно
            if [ ! -d "$BUNDLE_PIL/.dylibs" ] && [ -d "$RUNNER_PIL/.dylibs" ]; then
              echo "Copying hidden .dylibs from runner to bundle..."
              cp -r "$RUNNER_PIL/.dylibs" "$BUNDLE_PIL/"
            fi
            
            # Используем delocate, чтобы "пришить" библиотеки к бинарникам внутри бандла
            # Это исправит пути @loader_path/.dylibs/...
            echo "Fixing dylib links inside the bundle..."
            pip install delocate
            delocate-path -v "$BUNDLE_PIL"
          else
            echo "Warning: Could not find PIL inside build/macos"
          fi

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Audaci-macOS
          path: build/macos/
          retention-days: 14

  # ──────────────────────────────────────────────
  #  Linux
  # ──────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Системные зависимости
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libglib2.0-dev ninja-build cmake clang \
            libvlc-dev vlc portaudio19-dev dpkg-dev fakeroot

      - name: Зависимости Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Модель Vosk
        id: vosk-cache
        uses: actions/cache@v4
        with:
          path: model
          key: vosk-model-small-ru-0.22

      - name: Скачивание модели
        if: steps.vosk-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o model.zip "${{ env.VOSK_MODEL_URL }}"
          unzip -q model.zip
          mv "${{ env.VOSK_MODEL_DIR }}" model
          rm model.zip

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Сборка Linux
        run: flet build linux --product "Audaci" --no-rich-output

      - name: Упаковка в .deb
        run: |
          APP_VERSION="1.0.0"
          ARCH="amd64"
          PKG_NAME="audaci_${APP_VERSION}_${ARCH}"
          mkdir -p "${PKG_NAME}/usr/local/lib/audaci" "${PKG_NAME}/usr/local/bin" "${PKG_NAME}/usr/share/applications" "${PKG_NAME}/DEBIAN"
          cp -r build/linux/. "${PKG_NAME}/usr/local/lib/audaci/"
          ln -sf "/usr/local/lib/audaci/audaci" "${PKG_NAME}/usr/local/bin/audaci"
          cat > "${PKG_NAME}/usr/share/applications/audaci.desktop" <<EOF
          [Desktop Entry]
          Name=Audaci
          Exec=/usr/local/bin/audaci
          Icon=/usr/local/lib/audaci/data/flutter_assets/assets/icon.png
          Type=Application
          Categories=Audio;Player;
          EOF
          cat > "${PKG_NAME}/DEBIAN/control" <<EOF
          Package: audaci
          Version: ${APP_VERSION}
          Architecture: ${ARCH}
          Depends: libgtk-3-0, libvlc5, vlc, portaudio19
          Maintainer: Audaci Team
          Description: Audaci Music Player
          EOF
          fakeroot dpkg-deb --build "$PKG_NAME"

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Audaci-Linux-deb
          path: "*.deb"
          retention-days: 14
