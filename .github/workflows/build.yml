name: Cross-Platform Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet

      - name: Скачивание языковой модели Vosk
        shell: bash
        run: |
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q model.zip
          mv vosk-model-small-ru-0.22 model
          rm model.zip

      - name: Сборка Windows EXE через Flet
        run: flet build windows --product "Audaci"

      - name: Сохранение результата (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: Audaci-Windows
          path: build/windows/

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet

      - name: Скачивание языковой модели Vosk
        shell: bash
        run: |
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q model.zip
          mv vosk-model-small-ru-0.22 model
          rm model.zip

      - name: Сборка macOS APP через Flet
        run: flet build macos --product "Audaci"

      - name: Сохранение результата (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: Audaci-macOS
          path: build/macos/
